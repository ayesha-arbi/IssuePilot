# ⚠️ This workflow auto-generates and posts a starter brief as a comment
# when an issue is labeled "good first issue". The AI-generated content
# has not been human-reviewed — maintainer verification recommended.
# See: https://github.com/ayesha-arbi/IssuePilot/blob/main/CONTRIBUTING.md#unreviewed-ai-output

name: Generate starter brief

on:
  issues:
    types: [labeled]

jobs:
  brief:
    if: github.event.label.name == 'good first issue'

jobs:
  brief:
    if: github.event.label.name == 'good first issue'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate and post starter brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx tsx src/actionEntry.ts
